<script>
    // 1. 페이지 전환 함수
    function showPage(pageId) {
        const target = document.getElementById(pageId);
        if (target) {
            document.querySelectorAll('.page-section').forEach(sec => sec.classList.remove('active'));
            target.classList.add('active');
            window.scrollTo(0, 0);
        }
    }

    // 2. 제품 리스트 정의
    const productList = [
        { id: 1, cat: 'sensor', name: "Product 1", img: "Product 1.PNG", file: "product 1.txt" },
        { id: 2, cat: 'sensor', name: "Product 2", img: "Product 2.PNG", file: "product 2.txt" },
        { id: 3, cat: 'sensor', name: "Product 3", img: "Product 3.PNG", file: "product 3.txt" },
        { id: 4, cat: 'patch', name: "Product 4", img: "Product 4.PNG", file: "product 4.txt" },
        { id: 5, cat: 'patch', name: "Product 5", img: "Product 5.PNG", file: "product 5.txt" },
        { id: 6, cat: 'patch', name: "Product 6", img: "Product 6.PNG", file: "product 6.txt" },
        { id: 7, cat: 'nibp', name: "Product 7", img: "Product 7.PNG", file: "product 7.txt" },
        { id: 8, cat: 'nibp', name: "Product 8", img: "Product 8.PNG", file: "product 8.txt" }
    ];

    // 3. 데이터 로딩 및 렌더링 함수
    async function fetchAndRenderData() {
        // 회사 소개글 불러오기
        try {
            const companyRes = await fetch('Company description.txt');
            if (companyRes.ok) {
                const companyText = await companyRes.text();
                const companyContent = document.getElementById('company-content');
                if (companyContent) companyContent.innerText = companyText;
            }
        } catch (e) { console.error("소개글 로딩 실패", e); }

        // 제품별 데이터 불러오기
        for (const p of productList) {
            try {
                const res = await fetch(p.file);
                if (!res.ok) throw new Error("파일을 찾을 수 없음");
                
                const text = await res.text();
                const specPart = text.substring(text.indexOf("Model"));
                
                const containerId = `list-${p.cat}`;
                const container = document.getElementById(containerId);
                if (container) {
                    const html = `
                        <div class="product-item">
                            <div class="product-image"><img src="${p.img}" alt="${p.name}" onerror="this.src='https://via.placeholder.com/300?text=No+Image'"></div>
                            <div class="product-info">
                                <h3>${p.name}</h3>
                                <p>This is medical device</p>
                                ${makeTable(specPart)}
                            </div>
                        </div>
                    `;
                    container.innerHTML += html;
                }
            } catch (e) { 
                console.error(`${p.name} (${p.file}) 로딩 실패:`, e); 
            }
        }
    }

    // 4. 테이블 생성 보조 함수
    function makeTable(specs) {
        if (!specs || specs.indexOf("Model") === -1) return "<p>사양 정보가 없습니다.</p>";
        let rows = specs.trim().split('\n');
        let html = '<table><thead><tr>';
        rows[0].split('\t').forEach(h => html += `<th>${h.trim()}</th>`);
        html += '</tr></thead><tbody>';
        for(let i=1; i<rows.length; i++) {
            if(!rows[i].trim()) continue;
            html += '<tr>';
            rows[i].split('\t').forEach(c => html += `<td>${c.trim()}</td>`);
            html += '</tr>';
        }
        return html + '</tbody></table>';
    }

    // 5. 초기화 실행 (모든 로직을 여기로 모았습니다)
    window.onload = function() {
        // 데이터 렌더링 실행
        fetchAndRenderData();

        // 이메일 폼 알림 설정 (요소가 있을 때만 실행하여 에러 방지)
        const emailForm = document.getElementById("emailForm");
        if (emailForm) {
            emailForm.onsubmit = function() {
                alert("문의해주셔서 감사합니다. 메일이 정상적으로 발송되었습니다.");
            };
        }
    };
</script>
